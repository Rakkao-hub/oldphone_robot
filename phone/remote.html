<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>แซน · ควบคุมทางไกล</title>
  <style>
    :root { --bg: #0d1117; --card: #161b22; --fg: #e6edf3; --dim: #8b949e; --acc: #3fb6ff; --red: #f85149; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px system-ui, sans-serif;
           display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 14px 16px 24px; }
    h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
    .dot.on { background: #3fb950; }
    #view { width: 100%; max-width: 480px; aspect-ratio: 4/3; background: #000; border-radius: 14px;
            display: grid; place-items: center; overflow: hidden; color: var(--dim); }
    #view img { width: 100%; height: 100%; object-fit: cover; display: none; }
    #view.live img { display: block; }
    #view.live span { display: none; }
    button { font: inherit; color: var(--fg); background: var(--card); border: 1px solid #30363d;
             border-radius: 12px; padding: 14px; touch-action: none; user-select: none; -webkit-user-select: none; }
    button:active { background: #21262d; }
    #talk { width: 100%; max-width: 480px; padding: 20px; font-size: 18px; }
    #talk.rec { background: var(--red); border-color: var(--red); }
    .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 8px; }
    .pad button { height: 64px; font-size: 22px; padding: 0; }
    #stop { background: var(--red); border-color: var(--red); font-size: 16px; }
    #msg { color: var(--dim); font-size: 14px; min-height: 1.2em; text-align: center; }
    #login { display: flex; gap: 8px; width: 100%; max-width: 480px; }
    #login input { flex: 1; font: inherit; padding: 12px; border-radius: 12px; border: 1px solid #30363d;
                   background: var(--card); color: var(--fg); }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <h1><span class="dot" id="dot"></span><span id="title">แซน</span></h1>

  <form id="login" class="hide">
    <input id="key" placeholder="ใส่รหัสควบคุม" autocomplete="off">
    <button>เข้า</button>
  </form>

  <div id="app" class="hide" style="display:contents">
    <div id="view"><img id="img" alt=""><span>กำลังเปิดกล้อง...</span></div>
    <button id="talk">🎤 กดค้างเพื่อพูด</button>
    <div class="pad">
      <span></span><button data-p="F20">▲</button><span></span>
      <button data-p="L30">◀</button><button id="stop">หยุด</button><button data-p="R30">▶</button>
      <span></span><button data-p="B20">▼</button><span></span>
    </div>
  </div>
  <div id="msg"></div>

  <script>
    const $ = s => document.querySelector(s);
    const msg = t => { $('#msg').textContent = t || ''; };

    // รหัส: จากลิงก์ (#k=...) หรือที่เคยใส่ไว้
    let key = new URLSearchParams(location.hash.slice(1)).get('k') || localStorage.getItem('sandKey') || '';
    if (location.hash) history.replaceState(null, '', location.pathname);

    const api = (path, opt = {}) => fetch(path, { ...opt, headers: { ...(opt.headers || {}), 'X-Key': key } });

    async function login() {
      const r = await api('/api/remote/state').catch(() => null);
      if (!r || r.status === 401) {
        $('#login').classList.remove('hide');
        $('#app').classList.add('hide');
        msg(r ? (key ? 'รหัสไม่ถูก' : '') : 'ติดต่อแซนไม่ได้');
        return;
      }
      localStorage.setItem('sandKey', key);
      $('#login').classList.add('hide');
      $('#app').classList.remove('hide');
      msg('');
      start();
    }
    $('#login').addEventListener('submit', e => { e.preventDefault(); key = $('#key').value.trim(); login(); });

    // ---------------------------------------------------------------- ภาพ + สถานะ
    let started = false;
    function start() {
      if (started) return;
      started = true;
      frames();
      state(); setInterval(state, 3000);
    }

    async function state() {
      try {
        const s = await (await api('/api/remote/state')).json();
        $('#title').textContent = s.name;
        $('#dot').classList.toggle('on', s.online);
      } catch (_) { $('#dot').classList.remove('on'); }
    }

    async function frames() {
      let url = null;
      for (;;) {
        try {
          const r = await api('/api/remote/frame');
          if (r.status === 200) {
            const next = URL.createObjectURL(await r.blob());
            $('#img').src = next;
            if (url) URL.revokeObjectURL(url);
            url = next;
            $('#view').classList.add('live');
          } else {
            $('#view').classList.remove('live');
            await new Promise(res => setTimeout(res, 800));  // มือถือแซนยังไม่ส่งภาพ (เพิ่งเริ่มดู หรือจอแซนยังไม่ได้แตะเริ่ม)
          }
        } catch (_) { await new Promise(res => setTimeout(res, 1500)); }
        await new Promise(res => setTimeout(res, 150));
      }
    }

    // ---------------------------------------------------------------- ขับรถ
    document.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', async () => {
      const r = await api('/api/remote/move', { method: 'POST', body: JSON.stringify({ prog: b.dataset.p }) }).catch(() => null);
      msg(r && r.ok ? '' : 'สั่งรถไม่ได้');
    }));
    $('#stop').addEventListener('click', () => api('/api/remote/stop', { method: 'POST', body: '{}' }));

    // ---------------------------------------------------------------- กดค้างเพื่อพูด
    let stream = null, rec = null, chunks = [];
    const MIME = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));

    async function talkStart(e) {
      e.preventDefault();
      if (rec) return;
      if (!window.MediaRecorder || !navigator.mediaDevices) return msg('เบราว์เซอร์นี้อัดเสียงไม่ได้ (ต้องเปิดผ่าน https)');
      try {
        stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      } catch (err) { return msg('ไม่ได้อนุญาตไมค์: ' + err.name); }
      chunks = [];
      rec = new MediaRecorder(stream, MIME ? { mimeType: MIME } : undefined);
      rec.ondataavailable = ev => ev.data.size && chunks.push(ev.data);
      rec.onstop = send;
      rec.start();
      rec.t0 = Date.now();
      $('#talk').classList.add('rec');
      $('#talk').textContent = '🔴 กำลังพูด... ปล่อยเพื่อส่ง';
    }

    function talkEnd() {
      if (!rec) return;
      $('#talk').classList.remove('rec');
      $('#talk').textContent = '🎤 กดค้างเพื่อพูด';
      rec.stop();
    }

    async function send() {
      const r = rec; rec = null;
      if (Date.now() - r.t0 < 400) return msg('กดค้างไว้ขณะพูดนะ');
      const blob = new Blob(chunks, { type: r.mimeType || 'audio/webm' });
      msg('กำลังส่งเสียง...');
      const res = await api('/api/remote/voice', { method: 'POST', headers: { 'Content-Type': blob.type }, body: blob }).catch(() => null);
      msg(res && res.ok ? 'ส่งเสียงแล้ว ✓' : 'ส่งเสียงไม่ได้');
    }

    const talk = $('#talk');
    talk.addEventListener('pointerdown', talkStart);
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => talk.addEventListener(ev, talkEnd));
    talk.addEventListener('contextmenu', e => e.preventDefault());

    login();
  </script>
</body>
</html>
